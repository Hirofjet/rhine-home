<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <script>
      // 在首屏绘制前应用主题，避免刷新时闪回默认配色
      ;(() => {
        try {
          const theme = localStorage.getItem('rhine:theme')
          if (theme === 'rhine' || theme === 'archive' || theme === 'sakura' || theme === 'noctis') {
            document.documentElement.dataset.theme = theme
          }
        } catch {
          /* ignore */
        }
      })()
    </script>
    <meta
      name="description"
      content="RHINE//HOME —— 莱茵生命风格的个人主页：干员档案、能力模块、项目档案与联络终端。"
    />
    <title>SAMPLE//HOME · 个人主页</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
