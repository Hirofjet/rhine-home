<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <script>
      // 在首屏绘制前应用主题，避免刷新时闪回默认配色
      ;(() => {
        try {
          const theme = localStorage.getItem('rhine:theme')
          if (theme === 'rhine' || theme === 'archive' || theme === 'sakura' || theme === 'noctis') {
            document.documentElement.dataset.theme = theme
          }
          const brand = localStorage.getItem('rhine:brand')
          if (brand && !/sample/i.test(brand)) document.title = `${brand} · 个人主页`
        } catch {
          /* ignore */
        }
      })()
    </script>
    <meta
      name="description"
      content="Hirofjet 的个人主页：干员档案、能力模块、项目档案、日志与联络终端。"
    />
    <link rel="canonical" href="https://www.hirofjet.cn/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hirofjet//HOME" />
    <meta property="og:title" content="Hirofjet//HOME · 个人主页" />
    <meta
      property="og:description"
      content="Hirofjet 的个人主页：干员档案、能力模块、项目档案、日志与联络终端。"
    />
    <meta property="og:url" content="https://www.hirofjet.cn/" />
    <meta property="og:image" content="https://www.hirofjet.cn/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hirofjet//HOME · 个人主页" />
    <meta
      name="twitter:description"
      content="Hirofjet 的个人主页：干员档案、能力模块、项目档案、日志与联络终端。"
    />
    <meta name="twitter:image" content="https://www.hirofjet.cn/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Hirofjet//HOME",
        "alternateName": "Hirofjet 个人主页",
        "url": "https://www.hirofjet.cn/",
        "description": "Hirofjet 的个人主页：干员档案、能力模块、项目档案、日志与联络终端。"
      }
    </script>
    <title>Hirofjet//HOME · 个人主页</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
